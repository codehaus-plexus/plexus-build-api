version: 2
updates:
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "daily"
    ignore:
      # Baseline is Maven 3.9 with Resolver 1.9; Maven 3.10 pulls Resolver 2.x.
      # Excludes the Maven artifacts this plugin uses.
      - dependency-name: "org.apache.maven:maven-core"
        versions: [">= 3.10.0"]
      - dependency-name: "org.apache.maven:maven-model"
        versions: [">= 3.10.0"]
      - dependency-name: "org.apache.maven:maven-model-builder"
        versions: [">= 3.10.0"]
      # Maven 3 so use SLF4J 1.7.x
      - dependency-name: "org.slf4j:*"
        versions: [">= 2.0.0"]
      # plexus-xml 4.x depends on the Maven 4 XML API
      - dependency-name: "org.codehaus.plexus:plexus-xml"
        versions: [">= 4.0.0"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
